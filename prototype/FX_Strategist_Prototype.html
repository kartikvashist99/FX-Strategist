<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX Strategist · Concept Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f4f6fa; --surface: #ffffff; --surface-2: #f8fafc; --line: #e4e8ef; --line-2: #eef1f6;
  --ink: #0e1b2e; --ink-2: #44526a; --muted: #75819a;
  --side: #0b1d36; --side-ink: #c9d3e6; --side-active: #16304f;
  --accent: #2a6cf6; --accent-ink: #ffffff; --accent-soft: #e8f0ff;
  --high: #127a55; --high-bg: #e2f4eb; --med: #a95b06; --med-bg: #fdf0dc; --low: #b8322a; --low-bg: #fbe5e3; --lock: #3c4a63; --lock-bg: #e8ecf2;
  --series-1: #2a78d6; --series-2: #eb6834; --grid: #e9edf3;
  --radius: 10px; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; }
input, select { font: inherit; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }

/* demo bar */
#demobar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 14px; background: #1b1f2a; color: #e7eaf0; font-size: 12.5px; }
#demobar .tag { background: #f5b301; color: #1b1f2a; font-weight: 700; padding: 2px 8px; border-radius: 4px; letter-spacing: .04em; font-size: 11px; }
#demobar .date { font-weight: 600; font-size: 13.5px; color: #fff; }
#demobar button, #demobar input { background: #2b3242; color: #e7eaf0; border: 1px solid #3a4357; border-radius: 6px; padding: 4px 10px; }
#demobar button:hover { background: #353e52; }
#demobar .sp { flex: 1; }
#demobar .seg { display: inline-flex; border: 1px solid #3a4357; border-radius: 6px; overflow: hidden; }
#demobar .seg button { border: 0; border-radius: 0; }
#demobar .seg button.on { background: #f5b301; color: #1b1f2a; font-weight: 600; }
#demobar .hint { color: #9aa3b5; }

.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr) auto; min-height: calc(100vh - 44px); }
aside.side { background: var(--side); color: var(--side-ink); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 44px; height: calc(100vh - 44px); overflow: auto; }
.brand { display: flex; align-items: baseline; gap: 8px; padding: 4px 8px 12px; }
.brand b { color: #fff; font-size: 18px; letter-spacing: -.01em; }
.brand span { font-size: 10.5px; color: #8fa0bf; border: 1px solid #2c4366; padding: 1px 6px; border-radius: 10px; }
.merchant { background: #10284a; border-radius: 8px; padding: 8px 10px; margin: 0 0 12px; font-size: 12px; }
.merchant b { color: #fff; display: block; font-size: 13px; }
.navsec { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: #7d8fb0; padding: 12px 10px 4px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; color: var(--side-ink); background: none; border: 0; text-align: left; width: 100%; }
.nav:hover { background: #12294a; color: #fff; }
.nav.on { background: var(--side-active); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 #5b8cff; }
.nav.sub { padding-left: 26px; }
.badge { margin-left: auto; background: #f5b301; color: #1b1f2a; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 0 7px; }
.side .foot { margin-top: auto; font-size: 11px; color: #7d8fb0; padding: 10px 8px 0; border-top: 1px solid #1d3558; }

main { padding: 22px 28px 60px; min-width: 0; }
.ph { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 16px; }
.ph h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
.ph p { margin: 2px 0 0; color: var(--ink-2); }
.ph .sp { flex: 1; }
.crumb { font-size: 12px; color: var(--muted); margin-bottom: 4px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card.pad { padding: 16px 18px; }
.card h3 { margin: 0 0 4px; font-size: 15px; }
.card .sub { color: var(--muted); font-size: 12.5px; }
.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mt { margin-top: 16px; } .mt2 { margin-top: 24px; }
.kpi .lab { color: var(--muted); font-size: 12px; }
.kpi .val { font-size: 22px; font-weight: 650; margin-top: 2px; letter-spacing: -.01em; }
.kpi .foot { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.warn { color: var(--low); } .ok { color: var(--high); }

.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 14px; font-weight: 550; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(.95); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn.sm { padding: 4px 10px; font-size: 12.5px; }
.btn.danger { color: var(--low); }
.link { background: none; border: 0; color: var(--accent); padding: 0; font-weight: 550; }

table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12px; padding: 9px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); position: sticky; top: 0; }
table.t td { padding: 9px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.t td.r, table.t th.r { text-align: right; }
table.t tr.new td { background: #fffbea; }
.tablewrap { overflow: auto; max-height: 560px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
.chip.high { background: var(--high-bg); color: var(--high); }
.chip.medium { background: var(--med-bg); color: var(--med); }
.chip.low { background: var(--low-bg); color: var(--low); }
.chip.locked { background: var(--lock-bg); color: var(--lock); }
.chip.neutral { background: var(--line-2); color: var(--ink-2); }
.chip.new { background: #fff1b8; color: #6b5200; }
.chip .ico { font-size: 11px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.tabs button { background: none; border: 0; padding: 8px 12px; color: var(--ink-2); border-bottom: 2px solid transparent; font-weight: 550; }
.tabs button.on { color: var(--ink); border-color: var(--accent); }
.toolbar { display: flex; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.toolbar input[type=search] { border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; min-width: 240px; }
.pager { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; color: var(--muted); font-size: 12.5px; }

/* callout */
.callout { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: var(--radius); background: linear-gradient(90deg, #eef4ff, #f7f9ff); border: 1px solid #d6e3ff; }
.callout .ic { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; }
.callout .sp { flex: 1; }
.info { background: var(--surface-2); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; color: var(--ink-2); font-size: 12.5px; }

/* recommendation cards */
.rec { padding: 16px 18px; border-left: 4px solid var(--line); }
.rec.high { border-left-color: var(--high); } .rec.medium { border-left-color: #e08a1e; } .rec.low { border-left-color: var(--low); } .rec.locked { border-left-color: var(--lock); }
.rec .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rec .kind { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.rec h3 { font-size: 16px; margin: 6px 0 8px; }
.rec .action { display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; }
.rec .action .big { font-size: 20px; font-weight: 650; }
.rec .action .muted { color: var(--muted); font-size: 12.5px; }
.rec ul.why { margin: 10px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; }
.rec ul.why li { margin: 2px 0; }
.rec .btns { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
.rec .btns .sp { flex: 1; }
.rec.skipped { opacity: .55; }
.flag { margin-top: 10px; border: 1px solid #f3c98a; background: #fff8ec; border-radius: 8px; padding: 10px 12px; }
.flag b { color: var(--med); }
.flag .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.flag input { border: 1px solid #e6c48f; border-radius: 6px; padding: 5px 8px; width: 140px; }
.factors { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.factors .bar { display: inline-block; width: 54px; height: 6px; background: var(--line-2); border-radius: 3px; vertical-align: middle; margin-left: 4px; overflow: hidden; }
.factors .bar i { display: block; height: 100%; background: #7d93b8; border-radius: 3px; }
.tranches { margin-top: 8px; font-size: 12.5px; color: var(--ink-2); }
.summary-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
.summary-strip > div { padding: 12px 16px; border-right: 1px solid var(--line); }
.summary-strip > div:last-child { border-right: 0; }
.summary-strip .lab { font-size: 12px; color: var(--muted); }
.summary-strip .val { font-size: 18px; font-weight: 650; }

/* buckets */
.bucket .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line-2); margin: 10px 0 8px; gap: 2px; }
.bucket .bar i { display: block; height: 100%; }
.bucket .legend { display: flex; gap: 12px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

/* chart */
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .tip { position: absolute; pointer-events: none; background: #0e1b2e; color: #fff; font-size: 12px; padding: 7px 9px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%); display: none; }
.legendrow { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-2); margin: 6px 0 4px; flex-wrap: wrap; }
.legendrow .key { display: inline-block; width: 16px; height: 2px; vertical-align: middle; margin-right: 6px; }

/* modal */
.overlay { position: fixed; inset: 0; background: rgba(14, 27, 46, .45); display: grid; place-items: center; z-index: 50; }
.modal { background: #fff; border-radius: 12px; width: min(520px, 92vw); padding: 20px 22px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal h2 { margin: 0 0 6px; font-size: 18px; }
.modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0; }
.modal label { font-size: 12px; color: var(--ink-2); display: block; margin-bottom: 3px; }
.modal input { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.err { color: var(--low); font-size: 12.5px; margin-top: 6px; }
.note { color: var(--ink-2); font-size: 12.5px; margin-top: 6px; }
.fp { width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; margin: 14px auto; font-size: 38px; color: var(--accent); background: var(--accent-soft); cursor: pointer; transition: transform .2s; }
.fp.scan { animation: pulse 0.9s ease-in-out infinite; }
.fp.ok { border-color: var(--high); color: var(--high); background: var(--high-bg); }
@keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.07);} }
.steps { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13px; }
.steps li { padding: 4px 0; }

/* toasts */
#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { background: #0e1b2e; color: #fff; padding: 9px 14px; border-radius: 8px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }

/* phone */
#phone { width: 0; overflow: hidden; transition: width .2s; background: #e9edf3; border-left: 1px solid var(--line); position: sticky; top: 44px; height: calc(100vh - 44px); }
#phone.open { width: 300px; }
.phwrap { padding: 12px 10px; }
.phcap { font-size: 12px; color: var(--ink-2); text-align: center; margin-bottom: 8px; }
.device { zoom: 0.78; width: 360px; height: min(720px, calc((100vh - 100px) / 0.78)); border-radius: 40px; background: #111; padding: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.25); margin: 0 auto; }
.screen { width: 100%; height: 100%; border-radius: 31px; overflow: hidden; position: relative; background: #fff; display: flex; flex-direction: column; font-size: 13px; }
.sbar { height: 30px; display: flex; justify-content: space-between; align-items: center; padding: 0 22px; font-size: 12px; font-weight: 600; flex: none; }
.lock { background: linear-gradient(160deg, #20325a, #4b6cb7 60%, #9fb6e8); color: #fff; height: 100%; display: flex; flex-direction: column; }
.lock .clock { text-align: center; font-size: 58px; font-weight: 300; margin-top: 30px; }
.lock .ldate { text-align: center; font-size: 14px; opacity: .9; }
.notif { margin: 18px 12px 0; background: rgba(255,255,255,.88); color: #111; border-radius: 16px; padding: 10px 12px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
.notif .napp { font-size: 11px; color: #555; display: flex; gap: 6px; align-items: center; }
.wa-ic { width: 16px; height: 16px; border-radius: 4px; background: #25d366; color: #fff; display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; }
.wa { background: #efe7de; height: 100%; display: flex; flex-direction: column; }
.wa .head { background: #075e54; color: #fff; padding: 10px 12px; display: flex; gap: 10px; align-items: center; flex: none; }
.wa .head .av { width: 32px; height: 32px; border-radius: 50%; background: #fff; color: #0b1d36; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.wa .body { flex: 1; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.bub { background: #fff; border-radius: 0 10px 10px 10px; padding: 8px 10px; max-width: 88%; box-shadow: 0 1px 1px rgba(0,0,0,.08); font-size: 12.8px; }
.bub.me { align-self: flex-end; background: #dcf8c6; border-radius: 10px 0 10px 10px; }
.bub .time { font-size: 10px; color: #8a8a8a; text-align: right; }
.qr { display: flex; flex-direction: column; gap: 4px; max-width: 88%; }
.qr button { background: #fff; border: 0; border-radius: 8px; padding: 8px; color: #0a7cff; font-weight: 600; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
.app { height: 100%; position: relative; background: #f4f6fa; }
.app .ahead { background: #0b1d36; color: #fff; padding: 14px 14px 18px; }
.app .ahead small { opacity: .8; }
.app .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; }
.app .tile { background: #fff; border-radius: 10px; padding: 10px; font-size: 12px; }
.app .tile b { display: block; font-size: 15px; }
.dim { position: absolute; inset: 0; background: rgba(10, 18, 32, .55); display: grid; place-items: center; padding: 14px; }
.sheet { background: #fff; border-radius: 16px; padding: 14px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.sheet h4 { margin: 4px 0 6px; font-size: 15px; }
.sheet .amt { font-size: 22px; font-weight: 700; }
.sheet .btns { display: grid; gap: 6px; margin-top: 12px; }
.sheet .btns button { padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-weight: 600; }
.sheet .btns button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.sheet input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.sheet label { font-size: 11.5px; color: var(--ink-2); display: block; margin: 8px 0 3px; }
.ph-empty { text-align: center; color: #fff; opacity: .9; margin-top: 30px; font-size: 13px; }

@media (max-width: 1200px) { .g4 { grid-template-columns: repeat(2, 1fr); } }

table.t td.num { white-space: nowrap; }
.obtable td:last-child { white-space: nowrap; }
.obtable { max-height: none !important; }

main { container-type: inline-size; }
@container (max-width: 980px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .summary-strip { grid-template-columns: repeat(2, 1fr); } .summary-strip > div:nth-child(2) { border-right: 0; } }
@container (max-width: 760px) { .g3, .g2 { grid-template-columns: minmax(0, 1fr); } }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px #f5b301; } 100% { box-shadow: var(--shadow); } }

.obtable td:first-child { min-width: 200px; }
.obtable td:last-child .btn { padding: 4px 8px; }
.toolbar .btn { white-space: nowrap; }
@container (max-width: 980px) { .obtable .sub { display: none; } }

/* guided demo */
#tourpanel { position: fixed; left: 14px; bottom: 14px; width: 390px; z-index: 55; background: #121a2b; color: #e8ecf4; border-radius: 12px; padding: 12px 14px 12px; box-shadow: 0 14px 40px rgba(0,0,0,.35); font-size: 13px; }
#tourpanel .tp-head { display: flex; gap: 8px; align-items: center; color: #9aa6bd; font-size: 12px; }
#tourpanel .tag { background: #f5b301; color: #1b1f2a; font-weight: 700; padding: 1px 7px; border-radius: 4px; font-size: 10.5px; letter-spacing: .04em; }
#tourpanel .tp-x { background: none; border: 0; color: #9aa6bd; font-size: 14px; }
#tourpanel .tp-bar { height: 3px; background: #26324a; border-radius: 2px; margin: 8px 0 10px; overflow: hidden; }
#tourpanel .tp-bar i { display: block; height: 100%; background: #f5b301; }
#tourpanel h4 { margin: 0 0 4px; font-size: 15px; color: #fff; }
#tourpanel p { margin: 0; line-height: 1.5; color: #cfd6e4; }
#tourpanel .tp-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
#tourpanel .tp-btns button { background: #26324a; color: #e8ecf4; border: 1px solid #34425f; border-radius: 7px; padding: 6px 12px; font-weight: 600; }
#tourpanel .tp-btns button.primary { background: #f5b301; border-color: #f5b301; color: #1b1f2a; }
#tourpanel .tp-btns button:disabled { opacity: .5; cursor: default; }
.tour-hl { outline: 3px solid #f5b301 !important; outline-offset: 3px; border-radius: 10px; transition: outline-color .3s; }

#demobar { flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; }
#demobar button, #demobar input { padding: 3px 9px; font-size: 12px; }
@media (max-width: 1600px) { #demobar .hint { display: none; } }

#tourpanel.video { width: 460px; }
#tourpanel .vcap { font-size: 18px; font-weight: 650; color: #fff; line-height: 1.35; }

.chip.market { background: #e8f0ff; color: #2a5bd7; }
.rec.market { border-left-color: #2a6cf6; }
.ratecard { display: grid; grid-template-columns: repeat(6, auto); gap: 18px; padding: 12px 16px; align-items: end; justify-content: space-between; }
.ratecard .lab { font-size: 12px; color: var(--muted); }
@container (max-width: 980px) { .ratecard { grid-template-columns: repeat(3, auto); } }

.ccyrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
.ccyrow .lab { font-size: 12px; color: var(--muted); margin-right: 4px; }
.ccy { display: inline-flex; gap: 6px; align-items: center; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; }
.ccy.on { border-color: #9cc9b1; background: #f3fbf6; }
.ccy.off { opacity: .55; }
.ccyrow .sub { flex-basis: 100%; }

#pending-card td.acts { white-space: nowrap; text-align: right; width: 1%; }
#pending-card td:first-child { width: 120px; white-space: nowrap; }
#pending-card td:nth-child(2) { width: 170px; }
#decisions-card td:first-child { width: 70px; }
#decisions-card td:nth-child(2) { width: 120px; }
#pending-card td.acts .btn { margin-left: 4px; padding: 3px 8px; font-size: 12px; }
td.empty { padding: 18px 12px !important; line-height: 1.5; }

#demobar { gap: 8px; }
@media (max-width: 1500px) { #demobar input[type=date] { width: 128px; } #demobar .tag { font-size: 10px; } }

</style>
</head>
<body>

        recs.push({
          key, kind: "locked", conf: null, title: `Convert the remaining ${monthName(id)} balance`, usd, date: b.execDate, bucket: id, deadline: b.deadline,
          tranches: [{ date: b.execDate, usd, bucket: id }],
          drivers: [`RBI EEFC rule: ${monthName(id)} receipts must be converted by ${pretty(b.deadline)}${b.deadline !== b.execDate ? ` (a ${weekday(b.deadline)} - so it executes ${pretty(b.execDate)})` : ""}`,
            `$${fmtUsd(usd)} is the unused balance after payments already made from it`,
            `If not scheduled, the deadline guardrail converts it automatically on ${pretty(b.execDate)}`],
        });
        free[id] = 0;
        projConv.push({ date: b.execDate, inr: usd * fxNow });
      }
    }

    // 3) funding needs for INR obligations
    const inrObs = obs.filter((o) => o.ccy === "INR");
    const balBefore = (date) => { // projected INR before obligations dated `date`
      let bal = S.inr;
      for (const c of projConv) if (c.date < date || (c.date === date)) bal += c.inr;
      for (const o of inrObs) if (o.date < date) bal -= o.amount;
      return bal;
    };
    const usedRecv = new Set();
    let i = 0;
    while (i < inrObs.length) {
      const first = inrObs[i];
      const grp = inrObs.filter((o) => o.date >= first.date && daysBetween(first.date, o.date) <= 6);
      const after = balBefore(first.date) - grp.reduce((s, o) => s + o.amount, 0);
      i += grp.length;
      const hasPrior = S.scheduled.some((x) => x.recKey && x.recKey.startsWith("fund:" + first.date));
      if (after >= buf - (hasPrior ? TOL * 3 : TOL)) continue;
      const needInr = buf - after;
      let convDate = prevBday(first.date); if (convDate < today) convDate = today;
      const usdNeed = ceil100(needInr / fxNow);
      const baseKey = "fund:" + first.date;
      const prior = S.scheduled.filter((x) => x.recKey && x.recKey.startsWith(baseKey));
      const priorUsd = prior.reduce((s, x) => s + x.usd, 0);
      const key = prior.length ? baseKey + ":gap" + prior.length : baseKey;
      const names = grp.map((o) => { const n = o.name.split(" (")[0]; return `${/^[A-Z]{2,}/.test(n) ? n : n.charAt(0).toLowerCase() + n.slice(1)} (${shortDate(o.date)})`; });
      const conf = Math.min(...grp.map((o) => o.conf));
      const tk = take(free, ids, usdNeed);
      const flaggedOb = grp.find((o) => o.conf < 80 && !o.contingency);
      if (tk.parts.length) {
        const usd = r2(tk.parts.reduce((s, p) => s + p.usd, 0));
        const tp = tranchePlan(S, usd, today, convDate);
        const tranches = tp.tranches, n = tranches.length;
        const rec = {
          key, kind: "fund", conf, title: (prior.length ? "Cover the remaining gap for " : "Fund ") + joinNames(names), usd, date: tranches[0].date, tranches, sources: tk.parts, vol: tp.info,
          drivers: (prior.length ? [`You approved $${fmtUsd(priorUsd)} for this earlier - ~₹${lakh(needInr)} is still needed to keep the buffer`] : []).concat(grp.map((o) => `${o.name}: ~₹${lakh(o.amount)} on ${pretty(o.date)}${o.seen ? ` (seen ${o.seen}x${o.status === "confirmed" ? ", confirmed by you" : ""})` : ""}${o.contingency ? " - kept as contingency (you said 'not sure')" : ""}`))
            .concat([`Projected INR before these: ₹${lakh(balBefore(first.date))}; keeps the ₹${lakh(buf)} buffer`, `Converts from the ${tk.parts.map((p) => monthName(p.bucket)).join(" + ")} balance (oldest first)`, volLine(tp.info)].concat(targetLine(S) ? [targetLine(S)] : [])),
          flagged: flaggedOb && S.flagConfirm["ob:" + flaggedOb.id] == null ? { type: "amount", ob: flaggedOb.id, label: `Confirm the expected ${flaggedOb.name.split(" (")[0]} amount (₹)`, value: Math.round(flaggedOb.amount), inr: true, why: `${flaggedOb.name.split(" (")[0]} varies month to month (₹${lakh(flaggedOb.low)}-₹${lakh(flaggedOb.high)} in the last year).` } : null,
          factors: grp[0].factors,
        };
        if (!S.skipped[key]) { recs.push(rec); tranches.forEach((t) => projConv.push({ date: t.date, inr: t.usd * fxNow })); }
        else {
          recs.push({ ...rec, skippedRec: true }); tk.parts.forEach((p) => (free[p.bucket] += p.usd));
          if (after < 0) recs.push({ key: "alert:skip:" + first.date, kind: "alert", conf: 30, title: `${joinNames(names).charAt(0).toUpperCase() + joinNames(names).slice(1)} will be short by ~₹${lakh(-after)}`, usd: ceil100(-after / fxNow), date: first.date, tranches: [],
            drivers: [`You skipped the conversion that funds this`, `Projected INR on ${pretty(first.date)}: ₹${lakh(after)} - the payment would fail or need an overdraft`, "Restore the recommendation below, or convert manually"] });
        }
      }
      if (tk.short * fxNow > TOL * 3) {
        // depend on expected receipts arriving before convDate
        const cands = recv.filter((e) => e.date < convDate && !usedRecv.has(e.id)).sort((a, b) => b.conf - a.conf);
        let need = tk.short, used = [];
        for (const e of cands) { if (need <= 0.5) break; used.push(e); usedRecv.add(e.id); need -= e.usd; }
        const usd = ceil100(Math.min(tk.short, used.reduce((s, e) => s + e.usd, 0)));
        const tkey = "topup:" + first.date;
        if (usd > 0) {
          const rconf = Math.min(...used.map((e) => e.conf));
          const low = used.filter((e) => e.conf < 80);
          const rec = {
            key: tkey, kind: "topup", conf: Math.min(conf, rconf), title: "Top up " + joinNames(names) + " from incoming receipts", usd, date: convDate,
            tranches: [{ date: convDate, usd }], receipts: used.map((e) => ({ id: e.id, client: e.client, usd: e.usd, date: e.date, conf: e.conf })),
            drivers: [`After the EEFC balance, ~$${fmtUsd(tk.short)} is still needed for ${names.join(" + ")}`,
              `Relies on ${used.length} expected receipt(s) totalling $${fmtUsd(used.reduce((s, e) => s + e.usd, 0))} before ${pretty(convDate)}`]
              .concat(used.map((e) => `${e.client}: $${fmtUsd(e.usd)} expected ~${shortDate(e.date)} - ${e.note || ""} (${e.conf}%)`)),
            flagged: low.length ? { type: "receipts", items: low.map((e) => ({ id: e.id, client: e.client, usd: e.usd, date: e.date, note: e.note })), label: "Do you expect these payments on time?", why: "Timing of these receipts is the uncertain input." } : null,
            factors: null,
          };
          if (!S.skipped[tkey]) { recs.push(rec); projConv.push({ date: convDate, inr: usd * fxNow }); }
          else recs.push({ ...rec, skippedRec: true });
        }
        if (need * fxNow > TOL) {
          recs.push({ key: "alert:" + first.date, kind: "alert", conf: 30, title: "Projected INR shortfall before " + joinNames(names), usd: ceil100(need), date: convDate,
            drivers: [`Even with expected receipts, ~₹${lakh(need * fxNow)} is uncovered`, "Options: delay a payment, use the INR buffer, or add a receipt you expect"], tranches: [] });
        }
      }
    }

    // 4) remaining balance in buckets whose deadline is in 11-45 days -> deadline tranche plan
    for (const id of ids) {
      const b = S.buckets.find((z) => z.id === id);
      const days = daysBetween(today, b.deadline);
      if (free[id] >= 1000 && days > 10 && days <= 45) {
        const usd = r2(free[id]);
        let d2 = b.execDate; for (let j = 0; j < 2; j++) d2 = prevBday(d2);
        let start = addDays(today, 1); while (!isBday(start)) start = addDays(start, 1);
        const tp = tranchePlan(S, usd, start, d2);
        const key = "plan:" + id;
        recs.push({
          key, kind: "deadline", conf: null, title: `Convert the rest of the ${monthName(id)} balance before its deadline`, usd, date: tp.tranches[0].date, bucket: id, deadline: b.deadline,
          tranches: tp.tranches, vol: tp.info,
          drivers: [`RBI EEFC rule: ${monthName(id)} receipts must be converted by ${pretty(b.deadline)}`, `No near-term INR need uses this $${fmtUsd(usd)} - spreading it avoids putting it all on one day's rate`, volLine(tp.info)].concat(targetLine(S) ? [targetLine(S)] : [], ["The deadline guardrail converts anything left on " + pretty(b.execDate)]),
        });
        free[id] = 0;
      }
    }

    // 4b) opportunity alert: rate well above its recent average -> offer to pull approved tranches forward
    {
      const cfg = cfgOf(S), ctx = marketContext(S);
      const pull = S.scheduled.filter((x) => !x.executed && x.date > today);
      const tHit = cfg.targetRate && ctx.rate >= cfg.targetRate;
      if (!tHit && ctx.premium >= cfg.alertPct && pull.length) {
        const usdP = r2(pull.reduce((s, x) => s + x.usd, 0));
        const key = "opp:" + today;
        const rec = { key, kind: "opportunity", conf: null, title: `USD/INR is ${ctx.premium.toFixed(2)}% above its 20-day average - convert approved tranches today?`, usd: usdP, date: today,
          tranches: pull.map((x) => ({ date: today, usd: x.usd })), pullIds: pull.map((x) => x.id),
          drivers: [`Today ${ctx.rate.toFixed(2)} vs 20-day average ${ctx.avg20.toFixed(2)} (+${ctx.premium.toFixed(2)}%) - your alert threshold is +${cfg.alertPct}%`,
            `${pull.length} approved tranche(s), $${fmtUsd(usdP)}, are scheduled for ${[...new Set(pull.map((x) => shortDate(x.date)))].join(", ")}`,
            `Converting today ≈ ₹${lakh(usdP * (ctx.rate - ctx.avg20))} more than at the 20-day average rate`,
            "A market alert, not a prediction - the rate may rise further or fall back. Your cash plan is unchanged either way."] };
        recs.push(S.skipped[key] ? { ...rec, skippedRec: true } : rec);
      }
    }

    // 5) question: one-off seen once
    const off = D.obligations.find((o) => o.id === "offsite");
    if (S.answers.offsite == null && off.dates[0] > today) {
      recs.push({ key: "q:offsite", kind: "question", conf: off.conf, title: "Will the team offsite recur this November?", usd: null, date: off.dates[0], inr: off.estimate,
        drivers: [`₹${lakh(off.estimate)} paid to Coorg Retreats on 14 Nov 2025 - seen only once`, "One occurrence is not enough to forecast, so the agent asks instead of guessing", "Your answer changes the November funding plan"], tranches: [] });
    }

    const rank = { opportunity: -1, locked: 0, alert: 1, hold: 2, fund: 3, topup: 4, question: 5, deadline: 6 };
    return recs.sort((a, b) => (a.skippedRec - b.skippedRec) || a.date.localeCompare(b.date) || rank[a.kind] - rank[b.kind]);
  }

  // ---------- projection for the cash calendar ----------
  function project(S, withRecs) {
    const fxNow = rate(S.date);
    const recs = withRecs ? plan(S).filter((r) => !r.skippedRec) : [];
    const conv = S.scheduled.filter((x) => !x.executed).map((x) => ({ date: x.date, inr: x.usd * fxNow }));
    recs.forEach((r) => (r.tranches || []).forEach((t) => conv.push({ date: t.date, inr: t.usd * fxNow })));
    if (!withRecs) {
      // without the agent: deadline guardrail still converts on deadline days
      const { free } = supply(S);
      S.buckets.forEach((b) => { if (b.execDate > S.date && b.execDate <= END && free[b.id] > 0.5) conv.push({ date: b.execDate, inr: free[b.id] * fxNow }); });
    }
    const obs = activeObligations(S).filter((o) => o.ccy === "INR");
    const out = []; let bal = S.inr; let d = S.date;
    out.push({ date: d, inr: bal });
    while (d < END) {
      d = addDays(d, 1);
      conv.filter((c) => c.date === d).forEach((c) => (bal += c.inr));
      obs.filter((o) => o.date === d).forEach((o) => (bal -= o.amount));
      out.push({ date: d, inr: bal });
    }
    return out;
  }

  // ---------- actions ----------
  const nowTime = (S) => { const n = S.audit.filter((a) => a.date === S.date).length; return `${String(10 + Math.min(n, 9)).padStart(2, "0")}:${String((n * 7) % 60).padStart(2, "0")}`; };
  function log(S, e) { S.audit.push({ date: S.date, time: nowTime(S), ...e }); }

  function approve(S, rec, opts) {
    opts = opts || {};
    const edited = !!opts.edited;
    const tranches = opts.tranches || rec.tranches || [];
    const auth = opts.auth || "Passkey (biometric)";
    const channel = opts.channel || "Dashboard";
    const fxNow = rate(S.date);
    S.metrics.decisions.push({ key: rec.key, title: rec.title, kind: rec.kind, conf: rec.conf, band: band(rec.conf, rec.kind), action: edited ? "edited" : "approved", date: S.date, channel });
    if (rec.kind === "opportunity") {
      const ids = new Set(rec.pullIds || []);
      S.scheduled.filter((x) => ids.has(x.id) && !x.executed).forEach((x) => { x.origDate = x.date; x.date = S.date; x.pulled = "opportunity alert"; });
      log(S, { actor: "Rohan Mehta (Founder)", event: "Opportunity alert accepted", detail: `Pulled ${ids.size} approved tranche(s) forward to today at ${fxNow.toFixed(2)}`, usd: rec.usd, rate: fxNow, rec: rec.key, rationale: rec.drivers.join(" | "), auth: auth + " · " + channel });
      S.scheduled.filter((x) => !x.executed && x.date <= S.date).forEach((x) => execConversion(S, x));
      return;
    }
    if (rec.kind === "hold") {
      const items = opts.items || rec.items;
      const usd = items.reduce((s, i) => s + i.usd, 0);
      S.holds.push({ key: rec.key, items: items.map((i) => ({ ...i })), usd, remainingUsd: usd, date: S.date });
      log(S, { actor: "Rohan Mehta (Founder)", event: edited ? "Hold approved (edited)" : "Hold approved", detail: `Keep $${fmtUsd(usd)} in EEFC for ${items.map((i) => i.name.split(" (")[0] + " (" + shortDate(i.date) + ")").join(", ")}`, usd, rec: rec.key, rationale: rec.drivers.join(" | "), auth: auth + " · " + channel, band: band(rec.conf, rec.kind), conf: rec.conf });
      return;
    }
    const totalUsd = tranches.reduce((s, t) => s + t.usd, 0);
    const co = totalUsd * fxNow > S.settings.coApproveInr;
    tranches.forEach((t, k) => {
      S.scheduled.push({ id: rec.key + "#" + k + "@" + S.date, recKey: rec.key, date: t.date, usd: t.usd, kind: rec.kind, executed: false, rationale: rec.title, coApproved: co, bucket: rec.bucket || (rec.sources && rec.sources[0] && rec.sources[0].bucket) || (rec.kind === "topup" ? bucketOf(t.date) : null), approvedRate: fxNow, approvedOn: S.date });
    });
    log(S, { actor: "Rohan Mehta (Founder)", event: (rec.kind === "locked" || rec.kind === "deadline" ? "Deadline conversion scheduled" : "Conversion approved") + (edited ? " (edited)" : ""),
      detail: tranches.map((t) => `$${fmtUsd(t.usd)} on ${pretty(t.date)}`).join("; ") + ` - ${rec.title}` + (cfgOf(S).targetRate ? ` · early if USD/INR ≥ ${cfgOf(S).targetRate.toFixed(2)}` : ""), usd: totalUsd, rate: fxNow, inr: totalUsd * fxNow, rec: rec.key, rationale: rec.drivers.join(" | "), auth: auth + " · " + channel, band: band(rec.conf, rec.kind), conf: rec.conf });
    if (co) log(S, { actor: "Ananya Rao (Finance Head)", event: "Co-approved", detail: `Above ₹${lakh(S.settings.coApproveInr)} threshold - second approval recorded`, usd: totalUsd, rec: rec.key, auth: "Passkey (biometric) · Mobile app" });
    // execute anything dated today
    S.scheduled.filter((x) => !x.executed && x.date <= S.date).forEach((x) => execConversion(S, x));
  }
  function skip(S, rec, channel) {
    S.skipped[rec.key] = true;
    S.metrics.decisions.push({ key: rec.key, title: rec.title, kind: rec.kind, conf: rec.conf, band: band(rec.conf, rec.kind), action: "skipped", date: S.date, channel: channel || "Dashboard" });
    log(S, { actor: "Rohan Mehta (Founder)", event: "Recommendation skipped", detail: rec.title, rec: rec.key, usd: rec.usd, auth: channel || "Dashboard" });
  }
  function answer(S, key, value, channel) {
    if (key === "q:offsite") S.answers.offsite = value;
    S.metrics.decisions.push({ key, title: "Team offsite question", kind: "question", conf: null, band: "Low", action: "answered:" + value, date: S.date, channel: channel || "Dashboard" });
    log(S, { actor: "Rohan Mehta (Founder)", event: "Question answered", detail: `Team offsite this November? -> ${value === "yes" ? "Yes" : value === "no" ? "No" : "Not sure"}`, rec: key, auth: channel || "Dashboard" });
  }
  function confirmFlag(S, flag, value) {
    if (flag.type === "amount") { S.flagConfirm["ob:" + flag.ob] = Number(value); log(S, { actor: "Rohan Mehta (Founder)", event: "Input confirmed", detail: `${flag.label}: ${flag.inr ? "₹" + Number(value).toLocaleString("en-IN") : "$" + fmtUsd(Number(value))}` }); }
    if (flag.type === "receipts") { flag.items.forEach((it) => (S.flagConfirm["rc:" + it.id] = value)); log(S, { actor: "Rohan Mehta (Founder)", event: "Input confirmed", detail: `Expected receipts (${flag.items.map((x) => x.client).join(", ")}): ${value === "yes" ? "on time" : "not sure"}` }); }
  }
  function setObligation(S, id, status, estimate) {
    S.obState[id] = { ...(S.obState[id] || {}), status };
    if (estimate != null) S.obState[id].estimate = estimate;
    const o = D.obligations.find((x) => x.id === id);
    log(S, { actor: "Rohan Mehta (Founder)", event: "Obligation " + status, detail: o.name + (estimate != null ? ` - amount set to ${o.ccy === "INR" ? "₹" + Number(estimate).toLocaleString("en-IN") : "$" + fmtUsd(estimate)}` : "") });
  }

  // ---------- simulation ----------
  function addLedger(S, l) { S.newLedger.push({ date: S.date, ...l }); }
  function execConversion(S, x, isGuardrail) {
    const fx = rate(S.date);
    const c = commitments(S, x.id);
    const ids = c.ids;
    const avail = (id) => (isGuardrail && id === x.bucket ? S.buckets.find((z) => z.id === id).remaining : Math.max(0, c.free[id]));
    let usd = x.usd;
    let need = usd; const parts = [];
    const order = x.bucket && c.free[x.bucket] != null ? [x.bucket, ...ids.filter((i) => i !== x.bucket)] : ids;
    for (const id of order) {
      const b = S.buckets.find((z) => z.id === id); const t = Math.min(avail(id), b.remaining, need);
      if (t > 0.001) { b.remaining = r2(b.remaining - t); b.converted = r2(b.converted + t); need -= t; parts.push({ bucket: id, usd: r2(t) }); }
      if (need <= 0.001) break;
    }
    usd = r2(usd - Math.max(0, need));
    const inr = usd * fx;
    S.inr += inr;
    x.executed = true; x.execDate = S.date; x.rate = fx; x.inr = inr; x.parts = parts;
    parts.forEach((p) => addLedger(S, { entry: "Debit - conversion to INR", ref: isGuardrail ? "Deadline guardrail" : "FX Strategist plan", usd: -p.usd, bucket: p.bucket }));
    const label = isGuardrail ? "Auto-converted (deadline guardrail)" : "Agent plan - approved";
    S.newConv.push({ date: S.date, type: label, usd, rate: fx, inr, bucket: parts.map((p) => p.bucket).join("+"), rec: x.recKey, approvedRate: x.approvedRate || null, approvedOn: x.approvedOn || null, pulled: x.pulled || null, origDate: x.origDate || null });
    S.newTx.push({ date: S.date, type: "Conversion", party: "USD to INR", ref: label, ccy: "USD", amount: usd, dir: "conv", note: `@ ${fx.toFixed(4)} = INR ${Math.round(inr).toLocaleString("en-IN")}` + (x.approvedRate ? ` (approved at ${x.approvedRate.toFixed(2)})` : ""), isNew: true });
    log(S, { actor: isGuardrail ? "Deadline guardrail" : "FX Strategist (agent)", event: isGuardrail ? "Auto-converted at deadline" : x.manualNow ? "Executed early (merchant request)" : x.pulled ? "Converted early (" + x.pulled + ")" : "Conversion executed", detail: `${x.rationale || ""}`.trim() + (x.approvedRate ? ` - approved ${shortDate(x.approvedOn)} at ${x.approvedRate.toFixed(2)}, executed at ${fx.toFixed(2)} (${(usd * (fx - x.approvedRate)) >= 0 ? "+" : "-"}INR ${Math.abs(Math.round(usd * (fx - x.approvedRate))).toLocaleString("en-IN")} vs estimate)` : ""), usd, rate: fx, inr, bucket: parts.map((p) => p.bucket).join("+"), rec: x.recKey, auth: isGuardrail ? "RBI rule - no approval needed" : (x.coApproved ? "Approved + co-approved" : "Approved") });
  }
  function stepDay(S) {
    const d = addDays(S.date, 1); S.date = d; const fx = rate(d);
    // 1 receipts
    for (const r of D.actual.receipts.filter((x) => x.date === d)) {
      const id = bucketOf(d);
      let b = S.buckets.find((z) => z.id === id);
      if (!b) { b = { id, received: 0, used: 0, converted: 0, remaining: 0, receiptRate: fx, deadline: bucketDeadline(id), execDate: onOrBeforeBday(bucketDeadline(id)), autoConverted: 0 }; S.buckets.push(b); }
      b.receiptRate = (b.receiptRate * b.received + fx * r.usd) / (b.received + r.usd);
      b.received = r2(b.received + r.usd); b.remaining = r2(b.remaining + r.usd);
      addLedger(S, { entry: "Credit - receipt", ref: r.id, usd: r.usd, bucket: id });
      S.newTx.push({ date: d, type: "Payment received", party: r.client, ref: r.id, ccy: "USD", amount: r.usd, dir: "in", note: "Settled to EEFC (USD)", isNew: true });
      const e = D.expected.find((z) => z.id === r.id);
      if (e) S.metrics.forecasts.push({ kind: "receipt", name: r.client, expected: e.date, actual: d, conf: e.conf, band: band(e.conf), errDays: daysBetween(e.date, d), hit: Math.abs(daysBetween(e.date, d)) <= 3 });
    }
    // 1b target rate: approved tranches convert early when the merchant's target is reached
    { const t = cfgOf(S).targetRate;
      if (t && fx >= t) {
        const early = S.scheduled.filter((x) => !x.executed && x.date > d);
        if (early.length) {
          early.forEach((x) => { x.origDate = x.date; x.date = d; x.pulled = "target rate"; });
          log(S, { actor: "FX Strategist (agent)", event: "Target rate reached", detail: `USD/INR ${fx.toFixed(2)} ≥ your target ${t.toFixed(2)} - ${early.length} approved tranche(s) ($${fmtUsd(early.reduce((s, x) => s + x.usd, 0))}) converted early, as instructed at approval`, rate: fx, auth: "Pre-approved instruction" });
        }
      } }
    // 2 scheduled conversions
    S.scheduled.filter((x) => !x.executed && x.date <= d).forEach((x) => execConversion(S, x));
    // 3 USD payables
    for (const p of D.actual.usd.filter((x) => x.date === d)) {
      const total = S.buckets.reduce((s, b) => s + b.remaining, 0);
      const ob = obligationView(S, D.obligations.find((o) => o.id === p.ob));
      S.metrics.forecasts.push({ kind: "obligation", name: p.payee, expected: ob.est, actual: p.usd, ccy: "USD", conf: ob.conf, band: band(ob.conf), err: (p.usd - ob.est) / p.usd, hit: p.usd >= ob.low && p.usd <= ob.high });
      if (total >= p.usd) {

  }

  // ---------- EEFC ----------
  function eefc() {
    const fx = E.rate(S.date);
    const { free } = E.supply(S);
    const cards = S.buckets.slice().sort((a, b) => b.id.localeCompare(a.id)).map((b) => {

      const tot = Math.max(b.received, 1);

      return `<div class="card pad bucket" data-bucket="${b.id}"><div style="display:flex;justify-content:space-between;align-items:center"><h3>${E.monthName(b.id)} receipts</h3>${status}</div>
        <div class="sub">Received ${usd2(b.received)} · avg rate on receipt ${b.receiptRate.toFixed(2)}</div>

        <div class="legend"><span><span class="dot" style="background:#7d93b8"></span>Used for USD payments ${usd(b.used)}</span><span><span class="dot" style="background:var(--series-1)"></span>Converted ${usd(b.converted)}</span><span><span class="dot" style="background:#f0b44c"></span>Remaining ${usd2(b.remaining)}</span></div>
        ${S.newConv.filter((c) => c.bucket.split("+").includes(b.id)).map((c) => `<div class="note">✓ Converted ${usd(c.usd)} on ${P(c.date)} at ${c.rate.toFixed(2)}${c.approvedRate ? ` <span class="sub">(approved ${SD(c.approvedOn)} at ${c.approvedRate.toFixed(2)}${c.pulled ? `; early via ${c.pulled}, was due ${SD(c.origDate)}` : ""})</span>` : ` <span class="sub">(deadline guardrail)</span>`}</div>`).join("")}
        ${al.scheduled.length ? `<div class="note">⏳ Approved, converts on execution date: ${al.scheduled.map((s) => usd(s.usd) + " on " + P(s.date)).join(", ")}</div>` : ""}
        ${al.held > 0.5 ? `<div class="note">🔒 Held for USD bills: ${usd(al.held)}</div>` : ""}
        ${b.remaining > 0.5 ? `<div class="note">Free to plan: ${usd(Math.max(0, free[b.id]))}</div>` : ""}</div>`;
    }).join("");
    let L = allLedger(); if (UI.ledgerBucket !== "all") L = L.filter((l) => l.bucket === UI.ledgerBucket);
    const rows = L.map((l) => `<tr><td class="num">${SD(l.date)}</td><td>${esc(l.entry)}</td><td>${esc(l.ref)}</td><td>${E.monthName(l.bucket)}</td><td class="r num ${l.usd > 0 ? "ok" : ""}">${l.usd > 0 ? "+" : "−"}${usd2(Math.abs(l.usd))}</td></tr>`).join("");
    return `<div class="crumb">Treasury</div><div class="ph"><div><h1>EEFC account</h1><p>USD settlements held in foreign currency (Multi-Currency EEFC Account, enabled ${P(D.meta.eefcStart)}).</p></div></div>
      <div class="grid g4">
        <div class="card pad kpi"><div class="lab">Total EEFC balance</div><div class="val num">${usd2(eefcTotal())}</div><div class="foot">≈ ${inrL(eefcTotal() * fx)}</div></div>
        <div class="card pad kpi"><div class="lab">Held for USD bills</div><div class="val num">${usd(heldTotal())}</div><div class="foot">Approved holds</div></div>
        <div class="card pad kpi"><div class="lab">Scheduled to convert</div><div class="val num">${usd(schedTotal())}</div><div class="foot">${S.scheduled.filter((x) => !x.executed).length} approved conversion(s)</div></div>
        <div class="card pad kpi"><div class="lab">USD/INR today</div><div class="val num">${fx.toFixed(4)}</div><div class="foot">Live mid rate, 0% markup (synthetic)</div></div>
      </div>
      <div class="ccyrow mt" id="ccyrow"><span class="lab">Currencies held</span>
        <span class="ccy on"><b>USD</b> ${usd(eefcTotal())} <span class="chip high">FX Strategist · Pilot</span></span>
        ${["EUR", "GBP", "AED", "SGD"].map((c) => `<span class="ccy off" title="Supported by the Multi-Currency EEFC Account - FX Strategist planning arrives in v2"><b>${c}</b> - <span class="chip neutral">v2</span></span>`).join("")}
        <span class="sub">FX Strategist pilots on USD, where most export receipts are; other currencies follow once pilot metrics hold.</span></div>
      <div class="info mt">📘 <b>RBI rule:</b> the sum of receipts credited in a calendar month must be converted to INR by the last day of the following month, after USD used for permitted payments. Each card below is one month's "bucket".</div>
      <div class="grid g2 mt">${cards}</div>
      <div class="card mt2"><div class="toolbar"><b>EEFC ledger</b><span style="flex:1"></span><select data-act="ledgerbucket"><option value="all">All buckets</option>${S.buckets.map((b) => `<option value="${b.id}" ${UI.ledgerBucket === b.id ? "selected" : ""}>${E.monthName(b.id)}</option>`).join("")}</select></div>
      <div class="tablewrap"><table class="t"><thead><tr><th>Date</th><th>Entry</th><th>Reference</th><th>Bucket</th><th class="r">USD</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }

  // ---------- CASH CALENDAR ----------
  function calendar() {
    const past = D.daily.filter((d) => d.date >= E.addDays(D.meta.today, -30)).concat(S.newDaily).filter((d) => d.date <= S.date && d.date >= E.addDays(S.date, -30));
    const withP = E.project(S, true), without = E.project(S, false);
    const obs = [];
    const fxNow = E.rate(S.date);
    E.plan(S).filter((r) => !r.skippedRec).forEach((r) => (r.tranches || []).forEach((t) => obs.push({ date: t.date, kind: "Recommended conversion", what: r.title, amt: "+" + inrL(t.usd * fxNow), sub: usd(t.usd), conf: r })));
    S.scheduled.filter((x) => !x.executed).forEach((x) => obs.push({ date: x.date, kind: "Approved conversion", what: x.rationale, amt: "+" + inrL(x.usd * fxNow), sub: usd(x.usd), conf: { kind: "locked", conf: null, approved: true } }));
    D.obligations.forEach((o0) => { const o = E.obligationView(S, o0); if (o.status === "removed") return; o.dates.filter((d) => d > S.date && d <= E.END).forEach((d) => {
      if (o.id === "offsite" && S.answers.offsite !== "yes") { if (S.answers.offsite == null) obs.push({ date: d, kind: "Unconfirmed one-off", what: o.name + " - awaiting your answer", amt: "−" + inrL(o.estimate), sub: "seen once", conf: { conf: o.conf, kind: "question" } }); return; }
      obs.push({ date: d, kind: o.ccy === "USD" ? "USD bill (paid from EEFC)" : "Payment", what: o.name, amt: "−" + (o.ccy === "USD" ? usd(o.est) : inrL(o.est)), sub: o.cadence + " · seen " + o.seen + "x", conf: { conf: o.conf, kind: "x" } }); }); });
    E.expectedReceipts(S).filter((e) => e.date <= E.END).forEach((e) => obs.push({ date: e.date, kind: "Expected receipt (to EEFC)", what: e.client, amt: "+" + usd(e.usd), sub: e.note, conf: { conf: e.conf, kind: "x" } }));
    obs.sort((a, b) => a.date.localeCompare(b.date));
    const rows = obs.map((o) => `<tr><td class="num">${P(o.date)}</td><td>${esc(o.kind)}</td><td>${esc(o.what)}</td><td class="r num">${o.amt}</td><td class="sub">${esc(o.sub)}</td><td>${o.conf.approved ? '<span class="chip high">✓ Approved</span>' : chip(o.conf)}</td></tr>`).join("");
    const minProj = Math.min(...withP.map((p) => p.inr)), minWithout = Math.min(...without.map((p) => p.inr));
    return `<div class="crumb">Treasury</div><div class="ph"><div><h1>Cash calendar</h1><p>INR runway and expected flows, learned from 24 months of history.</p></div></div>
      <div class="grid g3">
        <div class="card pad kpi"><div class="lab">INR balance today</div><div class="val num">${inr(S.inr)}</div><div class="foot">Buffer ${inrL(S.settings.buffer)}</div></div>
        <div class="card pad kpi"><div class="lab">Lowest point · with plan</div><div class="val num ${minProj < S.settings.buffer - 30000 ? "warn" : "ok"}">${inrL(minProj)}</div><div class="foot">Approved + recommended conversions</div></div>
        <div class="card pad kpi"><div class="lab">Lowest point · without plan</div><div class="val num ${minWithout < 0 ? "warn" : ""}">${inrL(minWithout)}</div><div class="foot">Only the RBI deadline guardrail converts</div></div>
      </div>
      <div class="card pad mt" id="chartcard"><h3>INR current account - last 30 days and next weeks to ${SD(E.END)}</h3>
        <div class="legendrow"><span><span class="key" style="background:var(--ink-2)"></span>Actual</span><span><span class="key" style="background:var(--series-1)"></span>Projected with FX Strategist plan</span><span><span class="key" style="background:var(--series-2)"></span>Projected without plan</span><span><span class="key" style="background:#b8c2d3"></span>Buffer ${inrL(S.settings.buffer)}</span></div>
        <div class="chart" id="chart">${chartSvg(past, withP, without)}<div class="tip" id="tip"></div></div></div>
      <div class="card mt"><div class="toolbar"><b>Upcoming flows</b><span class="sub">Confidence = how sure the agent is about the cash input, not the FX rate</span></div>
        <div class="tablewrap"><table class="t"><thead><tr><th>Date</th><th>Type</th><th>Item</th><th class="r">Amount</th><th>Basis</th><th>Confidence</th></tr></thead><tbody>${rows || '<tr><td colspan="6" class="sub">Nothing upcoming in view.</td></tr>'}</tbody></table></div></div>`;
  }
  let CH = null;
  function chartSvg(past, withP, without) {
    const W = 920, H = 300, L = 64, R = 16, T = 14, B = 30;
    const dates = []; let d = past.length ? past[0].date : S.date; while (d <= E.END) { dates.push(d); d = E.addDays(d, 1); }
    const idx = (s) => dates.indexOf(s);
    const all = past.map((p) => p.inr).concat(withP.map((p) => p.inr), without.map((p) => p.inr), [S.settings.buffer, 0]);
    let lo = Math.min(...all), hi = Math.max(...all); const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
    const step = niceStep((hi - lo) / 5); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const x = (i) => L + (i / (dates.length - 1)) * (W - L - R), y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const path = (arr) => arr.map((p, k) => (k ? "L" : "M") + x(idx(p.date)).toFixed(1) + "," + y(p.inr).toFixed(1)).join("");
    let grid = ""; for (let v = lo; v <= hi + 1; v += step) grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v === 0 ? "₹0" : (v / 1e5).toFixed(0) + "L"}</text>`;
    let xt = ""; dates.forEach((s, i) => { if (s.endsWith("-01") || s.endsWith("-15") || s === S.date) xt += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="${s === S.date ? "var(--ink)" : "var(--muted)"}" ${s === S.date ? 'font-weight="600"' : ""}>${s === S.date ? "Today" : SD(s)}</text>`; });
    const ti = idx(S.date);
    CH = { dates, past, withP, without, x, L, W, R, T, H, B, y };
    return `<svg viewBox="0 0 ${W} ${H}" id="chsvg" role="img" aria-label="INR balance projection">${grid}${xt}
      <line x1="${x(ti)}" x2="${x(ti)}" y1="${T}" y2="${H - B}" stroke="#c9d1de"/>
      <line x1="${L}" x2="${W - R}" y1="${y(S.settings.buffer)}" y2="${y(S.settings.buffer)}" stroke="#b8c2d3" stroke-width="1.5"/>
      ${lo < 0 ? `<rect x="${L}" y="${y(0)}" width="${W - L - R}" height="${y(lo) - y(0)}" fill="#fbe5e3" opacity=".6"/>` : ""}
      <path d="${path(without)}" fill="none" stroke="var(--series-2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="${path(withP)}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${past.length ? `<path d="${path(past)}" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linejoin="round"/>` : ""}
      <circle cx="${x(ti)}" cy="${y(S.inr)}" r="5" fill="var(--ink)" stroke="#fff" stroke-width="2"/>
      <line id="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#8a96ab" stroke-width="1" style="display:none"/>
      <rect id="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg>`;
  }
  function niceStep(r) { const p = Math.pow(10, Math.floor(Math.log10(r))); const n = r / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; }
  function wireChart() {
    const svg = document.getElementById("chsvg"), tip = document.getElementById("tip"), cross = document.getElementById("cross"); if (!svg) return;
    const hit = document.getElementById("hit");
    hit.addEventListener("mousemove", (ev) => {
      const r = svg.getBoundingClientRect(); const sx = ((ev.clientX - r.left) / r.width) * CH.W;
      const i = Math.max(0, Math.min(CH.dates.length - 1, Math.round(((sx - CH.L) / (CH.W - CH.L - CH.R)) * (CH.dates.length - 1))));
      const d = CH.dates[i]; const f = (arr) => (arr.find((p) => p.date === d) || {}).inr;
      const a = f(CH.past), w = f(CH.withP), o = f(CH.without);
      cross.setAttribute("x1", CH.x(i)); cross.setAttribute("x2", CH.x(i)); cross.style.display = "";
      tip.style.display = "block"; tip.style.left = (CH.x(i) / CH.W) * 100 + "%"; tip.style.top = "30px";
      tip.innerHTML = `<b>${P(d)}</b><br>${a != null ? "Actual " + inrL(a) + "<br>" : ""}${w != null ? "With plan " + inrL(w) + "<br>" : ""}${o != null ? "Without plan " + inrL(o) : ""}`;
    });
    hit.addEventListener("mouseleave", () => { tip.style.display = "none"; cross.style.display = "none"; });
  }

  // ---------- FX STRATEGIST ----------
  function strategist() {
    const all = recs();
    const act = all.filter((r) => !r.skippedRec), sk = all.filter((r) => r.skippedRec);
    const nextDl = S.buckets.filter((b) => b.remaining > 0.5 && b.deadline >= S.date).sort((a, b) => a.deadline.localeCompare(b.deadline))[0];
    const conv = act.filter((r) => r.tranches && r.tranches.length && r.kind !== "hold").reduce((s, r) => s + r.usd, 0);
    return `<div class="crumb">Treasury</div><div class="ph"><div><h1>✦ FX Strategist</h1><p>Plans when and how much of your EEFC balance to convert - around your payables, cash runway and RBI deadlines. Every conversion needs your approval.</p></div></div>
      <div class="card summary-strip">
        <div><div class="lab">Needs your decision</div><div class="val">${act.length}</div></div>
        <div><div class="lab">Proposed conversions</div><div class="val num">${usd(conv)}</div></div>
        <div><div class="lab">Approved & scheduled</div><div class="val num">${usd(schedTotal())}</div></div>
        <div><div class="lab">Next RBI deadline</div><div class="val">${nextDl ? `${E.monthName(nextDl.id)} · ${E.daysBetween(S.date, nextDl.deadline)}d` : "None open"}</div></div>
      </div>
      ${rateCard()}
      ${onboarding()}
      <div class="grid mt" style="gap:12px" id="reclist">${act.length ? act.map(recCard).join("") : `<div class="card pad"><h3>You're all set</h3><div class="sub">No decisions needed right now. Use the demo controls to move the date forward.</div></div>`}</div>
      ${sk.length ? `<h3 class="mt2" style="font-size:14px;color:var(--ink-2)">Skipped</h3><div class="grid" style="gap:8px">${sk.map((r) => `<div class="card pad rec skipped"><div class="top">${chip(r)}<span class="kind">${kindLabel[r.kind]}</span></div><b>${esc(r.title)}</b> <button class="link" data-act="unskip" data-k="${r.key}">Restore</button></div>`).join("")}</div>` : ""}
      ${scheduledList()}`;
  }
  function rateCard() {
    const c = E.marketContext(S), cfg = E.cfgOf(S);
    const hit = cfg.targetRate && c.rate >= cfg.targetRate;
    return `<div class="card mt ratecard" id="ratecard"><div><div class="lab">USD/INR today · pilot currency</div><b class="num">${c.rate.toFixed(2)}</b></div>
      <div><div class="lab">vs 20-day average ${c.avg20.toFixed(2)}</div><b class="num ${c.premium >= cfg.alertPct ? "ok" : ""}">${c.premium >= 0 ? "+" : ""}${c.premium.toFixed(2)}%</b></div>
      <div><div class="lab">Volatility (20-day)</div><b class="num">${c.sigma.toFixed(2)}% / day</b></div>
      <div><div class="lab">🎯 Target rate</div><b>${cfg.targetRate ? cfg.targetRate.toFixed(2) + (hit ? " · reached" : " · not reached") : "Off"}</b></div>
      <div><div class="lab">Opportunity alerts</div><b>above +${cfg.alertPct}%</b></div>
      <div style="align-self:center"><button class="link" data-act="nav" data-v="settings">Rate rules ›</button></div></div>`;
  }
  function onboarding() {
    const items = D.obligations.filter((o) => o.kind === "recurring").map((o) => E.obligationView(S, o));
    if (!UI.obOpen) { const live = items.filter((o) => o.status !== "removed"); const conf = live.filter((o) => o.status === "confirmed").length; return `<div class="info mt" id="obinfo">${conf === live.length ? "✓" : "ℹ"} Planning with ${live.length} recurring obligations learned from your history${conf ? ` (${conf} confirmed by you)` : ""}. Next due: ${live.map((o) => ({ o, d: E.nextOccurrence(o, S.date) })).filter((x) => x.d).sort((x, y) => x.d.localeCompare(y.d)).slice(0, 2).map((x) => esc(x.o.name.split(" (")[0]) + " " + SD(x.d)).join(", ")}. <button class="link" data-act="obopen">Review obligations</button></div>`; }
    const rows = items.map((o) => `<tr><td><b>${esc(o.name)}</b><div class="sub">${esc(o.note)}</div></td><td>${o.cadence}</td><td class="r num">${o.seen}x</td><td class="r num">${o.ccy === "INR" ? inrL(o.est) : usd(o.est)}</td><td class="num">${E.nextOccurrence(o, S.date) ? P(E.nextOccurrence(o, S.date)) : "-"}</td><td><span class="chip ${E.band(o.conf).toLowerCase()}" title="${E.band(o.conf)} confidence">● ${E.band(o.conf)} ${o.conf}%</span></td>
      <td>${o.status === "detected" ? `<button class="btn sm" data-act="obconfirm" data-v="${o.id}">Confirm</button> <button class="btn sm ghost" data-act="obedit" data-v="${o.id}">Edit</button> <button class="btn sm ghost danger" data-act="obremove" data-v="${o.id}" title="Remove from plan">✕</button>` : o.status === "removed" ? `<span class="chip low">Removed</span> <button class="link" data-act="obconfirm" data-v="${o.id}">Undo</button>` : `<span class="chip high">✓ Confirmed</span>`}</td></tr>`).join("");
    return `<div class="card mt" id="obcard"><div class="toolbar" style="background:#f7f9ff"><div><b>I analysed 24 months of your Razorpay history and found ${items.length} recurring obligations.</b><div class="sub">Confirm them so I plan with the right numbers. I also found 1 one-off payment I can't predict - I'll ask about it below.</div></div><span style="flex:1"></span>
      <button class="btn primary sm" data-act="obconfirmall">Confirm all</button>${S.onboarded ? ` <button class="btn sm" data-act="obclose">Done</button>` : ""}</div>
      <div class="tablewrap obtable"><table class="t"><thead><tr><th>Obligation</th><th>Cadence</th><th class="r">Seen</th><th class="r">Typical</th><th>Next</th><th>Confidence</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  function recCard(r) {
    const b = bandOf(r).toLowerCase(), fx = E.rate(S.date);
    let action = "";
    if (r.kind === "question") action = `<div class="action"><div><div class="big">${inrL(r.inr)}</div><div class="muted">paid to Coorg Retreats, 14 Nov 2025</div></div><div><div class="muted">If it recurs</div><b>~${P(r.date)}</b></div></div>`;
    else if (r.kind === "hold") action = `<div class="action"><div><div class="big num">Keep ${usd(r.usd)} in USD</div><div class="muted">no conversion - pay bills directly from EEFC</div></div>${r.items.map((i) => `<div><div class="muted">${esc(i.name.split(" (")[0])}</div><b>${usd(i.usd)} · ${SD(i.date)}</b></div>`).join("")}</div>`;
    else if (r.kind === "opportunity") { const c = E.marketContext(S); action = `<div class="action"><div><div class="big num">Convert ${usd(r.usd)} today</div><div class="muted">instead of on ${[...new Set(S.scheduled.filter((x) => (r.pullIds || []).includes(x.id)).map((x) => SD(x.date)))].join(", ")}</div></div><div><div class="muted">USD/INR now</div><b>${c.rate.toFixed(2)}</b></div><div><div class="muted">20-day average</div><b>${c.avg20.toFixed(2)}</b></div><div><div class="muted">Extra vs average</div><b class="ok">≈ ${inrL(r.usd * (c.rate - c.avg20))}</b></div></div>`; }
    else if (r.kind === "alert") action = `<div class="action"><div class="big warn">Shortfall ~${usd(r.usd)}</div></div>`;
    else action = `<div class="action"><div><div class="big num">Convert ${usd(r.usd)}</div><div class="muted">≈ ${inrL(r.usd * fx)} at today's ${fx.toFixed(2)}</div></div><div><div class="muted">${r.tranches.length > 1 ? "Tranches" : "On"}</div><b>${r.tranches.map((t) => (r.tranches.length > 1 ? usd(t.usd) + " · " : "") + P(t.date)).join("<br>")}</b></div>${r.deadline ? `<div><div class="muted">RBI deadline</div><b>${P(r.deadline)}</b></div>` : ""}${r.receipts ? `<div><div class="muted">From</div><b>Incoming receipts</b></div>` : r.sources ? `<div><div class="muted">From</div><b>${r.sources.map((s) => E.monthName(s.bucket)).join(" + ")} balance</b></div>` : ""}</div>`;
    const flag = r.flagged ? flagBox(r) : "";
    const f = r.factors ? `<div class="factors">Confidence drivers: ${[["History", r.factors.history], ["Timing", r.factors.timing], ["Amount", r.factors.amount]].map(([k, v]) => `<span>${k}<span class="bar"><i style="width:${Math.round(v * 100)}%"></i></span></span>`).join("")}</div>` : "";
    let btns = "";
    if (r.kind === "question") btns = `<button class="btn primary" data-act="ans" data-k="${r.key}" data-v="yes">Yes, it recurs</button><button class="btn" data-act="ans" data-k="${r.key}" data-v="no">No</button><button class="btn" data-act="ans" data-k="${r.key}" data-v="unsure">Not sure - keep a buffer</button>`;
    else if (r.kind === "alert") btns = `<span class="sub">Approve or edit the conversions above, or move the payment date.</span>`;
    else if (r.kind === "opportunity") btns = `<button class="btn primary" data-act="approve" data-k="${r.key}">Convert today</button><button class="btn ghost" data-act="skip" data-k="${r.key}">Keep the schedule</button><span class="sp"></span><button class="link" data-act="sendwa" data-k="${r.key}">📱 Send to WhatsApp</button>`;
    else {
      const blocked = !!r.flagged && b !== "high";
      btns = `<button class="btn primary" data-act="approve" data-k="${r.key}" ${blocked ? "disabled title='Confirm the flagged input first'" : ""}>${r.kind === "locked" || r.kind === "deadline" ? "Schedule" : "Approve"}</button>
        <button class="btn" data-act="edit" data-k="${r.key}">Edit</button>
        ${r.kind === "locked" || r.kind === "deadline" ? `<span class="sub">Can't be skipped - executes automatically on ${P(r.kind === "locked" ? r.date : r.tranches[r.tranches.length - 1].date)} if not scheduled</span>` : `<button class="btn ghost" data-act="skip" data-k="${r.key}">Skip</button>`}
        <span class="sp"></span><button class="link" data-act="sendwa" data-k="${r.key}">📱 Send to WhatsApp</button>`;
    }
    return `<div class="card rec ${b}" data-key="${r.key}"><div class="top">${r.kind === "alert" ? '<span class="chip low">⚠ Alert</span>' : chip(r)}<span class="kind">${kindLabel[r.kind]}</span></div>
      <h3>${esc(r.title)}</h3>${action}<ul class="why">${r.drivers.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>${f}${flag}<div class="btns">${btns}</div></div>`;
  }
  function flagBox(r) {
    const fl = r.flagged;
    if (fl.type === "amount") return `<div class="flag"><b>⚠ Check this input:</b> ${esc(fl.why)}<div class="row">${esc(fl.label)}: <input type="number" id="flag-${cssId(r.key)}" value="${fl.value}"> <button class="btn sm" data-act="flagok" data-k="${r.key}">Confirm amount</button></div></div>`;
    return `<div class="flag"><b>⚠ Check this input:</b> ${esc(fl.why)}<div class="row">${fl.items.map((i) => `${esc(i.client)} ${usd(i.usd)} ~${SD(i.date)}`).join(" · ")}</div><div class="row">${esc(fl.label)} <button class="btn sm" data-act="flagrc" data-k="${r.key}" data-v="yes">Yes, on time</button><button class="btn sm ghost" data-act="flagrc" data-k="${r.key}" data-v="unsure">Not sure</button></div></div>`;
  }
  const cssId = (k) => k.replace(/[^a-z0-9]/gi, "_");
  function scheduledList() {
    const sch = S.scheduled.filter((x) => !x.executed).sort((a, b) => a.date.localeCompare(b.date));
    const holds = S.holds.filter((h) => !h.released);
    const dec = S.metrics.decisions.slice().reverse().slice(0, 8);
    const fx = E.rate(S.date);
    const rowsS = sch.map((x) => { const L = E.schedLimits(S, x.id); return `<tr><td class="num">${P(x.date)}${x.modified ? ' <span class="chip neutral">changed</span>' : ""}</td><td><b>Convert ${usd(x.usd)}</b><div class="sub">≈ ${inrL(x.usd * fx)} at today's rate</div></td><td class="sub">${esc(x.rationale)}${L && L.latest < E.END ? `<div>RBI deadline: by ${SD(L.latest)}</div>` : ""}</td>
      <td class="acts"><button class="btn sm" data-act="schedit" data-v="${esc(x.id)}">Edit</button><button class="btn sm" data-act="schnow" data-v="${esc(x.id)}">Execute now</button><button class="btn sm ghost danger" data-act="schcancel" data-v="${esc(x.id)}">Cancel</button></td></tr>`; }).join("");
    const rowsH = holds.map((h) => `<tr><td class="num">Hold</td><td><b>${usd(h.remainingUsd)} in USD</b><div class="sub">no conversion</div></td><td class="sub">${h.items.map((i) => esc(i.name.split(" (")[0]) + " " + SD(i.date)).join(", ")}</td>
      <td class="acts"><button class="btn sm" data-act="holdedit" data-v="${esc(h.key)}">Edit</button><button class="btn sm ghost danger" data-act="holdrelease" data-v="${esc(h.key)}">Release</button></td></tr>`).join("");
    return `<div class="grid mt2" style="gap:14px"><div class="card ${UI.flash ? "flash" : ""}" id="pending-card"><div class="toolbar"><b>Approved & waiting to execute</b><span class="sub">${sch.length + holds.length} item${sch.length + holds.length === 1 ? "" : "s"}</span></div><table class="t"><tbody>
      ${rowsS}${rowsH}
      ${!sch.length && !holds.length ? '<tr><td class="sub empty">Nothing approved yet. Approved conversions and holds appear here until they execute - you can still edit, execute or cancel them.</td></tr>' : ""}</tbody></table></div>
      <div class="card" id="decisions-card"><div class="toolbar"><b>Your recent decisions</b><span class="sub">${S.metrics.decisions.length} total</span></div><table class="t"><tbody>${dec.map((d) => `<tr><td class="num">${SD(d.date)}</td><td>${esc(d.action.replace("answered:", "answered: "))}</td><td class="sub">${esc(d.title || d.key)} · ${esc(d.channel)}</td></tr>`).join("") || '<tr><td class="sub empty">No decisions yet. Approvals, edits, skips and answers - from the dashboard or WhatsApp - are listed here.</td></tr>'}</tbody></table></div></div>`;
  }
  function authSimple(title, sub, onDone) {
    modal(`<h2>${esc(title)}</h2><div class="sub">${sub}</div><div class="fp" id="fp" data-act="fp">☝︎</div><div class="note" style="text-align:center" id="fpnote">Touch to authenticate as Rohan Mehta</div><div class="foot"><button class="btn" data-act="mclose">Cancel</button></div>`);
    PENDING = () => { const fp = document.getElementById("fp"); fp.classList.add("scan"); document.getElementById("fpnote").textContent = "Verifying…"; setTimeout(() => { fp.classList.remove("scan"); fp.classList.add("ok"); fp.textContent = "✓"; setTimeout(() => { closeModal(); onDone(); }, 500); }, 800); };
  }
  function schedEditModal(id) {
    const L = E.schedLimits(S, id); if (!L) return; const x = L.x;
    modal(`<h2>Change approved conversion</h2><div class="sub">${esc(x.rationale)} · approved ${SD(x.approvedOn || S.date)}</div>
      <div class="row"><div><label>Amount (USD)</label><input type="number" id="se-u" value="${Math.round(x.usd)}" step="100"></div><div><label>Execution date</label><input type="date" id="se-d" value="${x.date}" min="${S.date}" max="${L.latest}"></div></div>
      <div class="note">Up to ${usd(L.maxUsd)} available · ${L.latest < E.END ? `must execute by ${P(L.latest)} (RBI deadline)` : "any date before the payment"} · today's date executes immediately.</div><div id="se-msg"></div>

  // ---------- REPORTS ----------
  function reports() {
    const tab = UI.reportTab;
    let body = "";
    if (tab === "audit") {
      const rows = S.audit.slice().reverse().map((a) => `<tr><td class="num">${SD(a.date)} ${a.time}</td><td>${esc(a.actor)}</td><td><b>${esc(a.event)}</b>${a.band ? ` ${chip({ conf: a.conf, kind: a.band === "Locked" ? "locked" : "x" })}` : ""}<div class="sub">${esc(a.detail)}</div>${a.rationale ? `<details><summary class="sub" style="cursor:pointer">Agent rationale</summary><div class="sub">${esc(a.rationale).split(" | ").join("<br>")}</div></details>` : ""}</td>
        <td class="r num">${a.usd != null ? usd2(a.usd) : ""}</td><td class="r num">${a.rate ? a.rate.toFixed(4) : ""}</td><td class="r num">${a.inr != null ? inr(a.inr) : ""}</td><td>${a.bucket ? E.monthName(a.bucket.split("+")[0]) : ""}</td><td class="sub">${esc(a.auth || "")}</td></tr>`).join("");
      body = `<div class="card" id="auditcard"><div class="toolbar"><b>Audit log</b><span class="sub">Every conversion with its rationale, rate, approval and authentication</span><span style="flex:1"></span><button class="btn sm" data-act="csv">⬇ Export for CA (CSV)</button></div>
        <div class="tablewrap"><table class="t"><thead><tr><th>When</th><th>Actor</th><th>Event</th><th class="r">USD</th><th class="r">Rate</th><th class="r">INR</th><th>Bucket</th><th>Authentication</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    } else if (tab === "comp") {
      const conv = D.convHist.filter((c) => c.date >= D.meta.eefcStart).map((c) => ({ ...c, by: "Manual" })).concat(S.newConv.map((c) => ({ ...c, by: c.type.startsWith("Auto") ? "Guardrail" : "Agent plan" })));
      const rows = S.buckets.map((b) => {
        const by = (k) => conv.filter((c) => c.bucket.split("+").includes(b.id) && c.by === k).reduce((s, c) => s + c.usd, 0);
        const st = b.remaining < 0.5 ? (b.autoConverted > 0 ? '<span class="chip medium">Compliant · guardrail used</span>' : '<span class="chip high">✓ Compliant</span>') : b.deadline < S.date ? '<span class="chip low">Overdue</span>' : `<span class="chip neutral">Open · due ${SD(b.deadline)}</span>`;
        return `<tr><td>${E.monthName(b.id)}</td><td class="r num">${usd2(b.received)}</td><td class="r num">${usd2(b.used)}</td><td class="r num">${usd(by("Manual"))}</td><td class="r num">${usd(by("Agent plan"))}</td><td class="r num">${usd(by("Guardrail"))}</td><td class="r num">${usd2(b.remaining)}</td><td class="num">${P(b.deadline)}</td><td>${st}</td></tr>`;
      }).join("");
      body = `<div class="card" id="compcard"><div class="toolbar"><b>EEFC compliance summary</b><span class="sub">RBI Master Direction - Deposits and Accounts, EEFC conversion rule</span></div><div class="tablewrap"><table class="t"><thead><tr><th>Bucket</th><th class="r">Received</th><th class="r">Used for payments</th><th class="r">Converted · manual</th><th class="r">· agent plan</th><th class="r">· guardrail</th><th class="r">Remaining</th><th>Deadline</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    } else {
      const c = D.convHist.map((x) => ({ ...x, src: "history" })).concat(S.newConv.map((x) => ({ ...x, src: "new" }))).reverse();
      body = `<div class="card"><div class="toolbar"><b>All conversions</b></div><div class="tablewrap"><table class="t"><thead><tr><th>Date</th><th>Type</th><th class="r">USD</th><th class="r">Approved at</th><th class="r">Executed at</th><th class="r">INR</th><th>Bucket</th></tr></thead><tbody>${c.map((x) => `<tr class="${x.src === "new" ? "new" : ""}"><td class="num">${SD(x.date)} ${x.date.slice(0, 4)}</td><td>${esc(x.type)}</td><td class="r num">${usd2(x.usd)}</td><td class="r num">${x.approvedRate ? x.approvedRate.toFixed(4) + `<div class="sub">${SD(x.approvedOn)}</div>` : "-"}</td><td class="r num">${x.rate.toFixed(4)}</td><td class="r num">${inr(x.inr)}</td><td>${x.bucket ? E.monthName(x.bucket.split("+")[0]) : "-"}</td></tr>`).join("")}</tbody></table></div></div>`;
    }
    return `<div class="ph"><div><h1>Reports & audit log</h1><p>Audit-grade record for your CA and statutory audit.</p></div></div>
      <div class="tabs"><button class="${tab === "audit" ? "on" : ""}" data-act="rtab" data-v="audit">Audit log</button><button class="${tab === "comp" ? "on" : ""}" data-act="rtab" data-v="comp">EEFC compliance</button><button class="${tab === "conv" ? "on" : ""}" data-act="rtab" data-v="conv">Conversions</button></div>${body}`;
  }
  function exportCsv() {
    const head = ["Date", "Time", "Actor", "Event", "Detail", "USD", "Rate", "INR", "Bucket", "Authentication", "Rationale"];
    const lines = [head.join(",")].concat(S.audit.map((a) => [a.date, a.time, a.actor, a.event, a.detail, a.usd != null ? a.usd.toFixed(2) : "", a.rate ? a.rate.toFixed(4) : "", a.inr != null ? Math.round(a.inr) : "", a.bucket || "", a.auth || "", a.rationale || ""].map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")));
    try { const blob = new Blob([lines.join("\n")], { type: "text/csv" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "fx-strategist-audit-log.csv"; document.body.appendChild(a); a.click(); a.remove(); toast("Audit log exported"); }
    catch (e) { toast("Export isn't available in this preview"); }
  }

  // ---------- OUTCOMES (internal) ----------
  function outcomes() {
    const o = E.outcomes(S);
    const acted = o.approved + o.edited + o.skipped;
    const pct = (a, b) => (b ? Math.round((a / b) * 100) + "%" : "-");
    const fc = o.forecasts.slice().reverse().map((f) => `<tr><td>${esc(f.name)}</td><td>${f.kind}</td><td class="r num">${f.kind === "receipt" ? SD(f.expected) : f.ccy === "USD" ? usd(f.expected) : inrL(f.expected)}</td><td class="r num">${f.kind === "receipt" ? SD(f.actual) : f.ccy === "USD" ? usd(f.actual) : inrL(f.actual)}</td><td class="r num">${f.kind === "receipt" ? (f.errDays > 0 ? "+" : "") + f.errDays + "d" : (f.err * 100).toFixed(1) + "%"}</td><td>${chip({ conf: f.conf, kind: "x" })}</td><td>${f.hit ? '<span class="chip high">✓ within range</span>' : '<span class="chip low">✗ outside</span>'}</td></tr>`).join("");
    return `<div class="crumb">Internal View (Razorpay only) · product analytics</div><div class="ph"><div><h1>FX Strategist outcomes</h1><p>Merchant: Lumio Analytics · pilot period from ${P(D.meta.today)}. In production these aggregate across the exporter cohort.</p></div></div>
      <div class="grid g3" id="northstar">
        <div class="card pad kpi"><div class="lab">North star · avoided FX costs since EEFC</div><div class="val num ok">${inrL(o.avoided)}</div><div class="foot">USD bills paid from EEFC instead of buying USD at ~3% card markup</div></div>
        <div class="card pad kpi"><div class="lab">Rate timing effect vs convert-at-settlement</div><div class="val num ${o.rateEffect < 0 ? "warn" : "ok"}">${o.rateEffect >= 0 ? "+" : ""}${inrL(o.rateEffect)}</div><div class="foot">Reported separately - not claimed as agent skill</div></div>
        <div class="card pad kpi"><div class="lab">Baseline · before EEFC (22 months)</div><div class="val num">${inrL(D.meta.historicalAvoidable)}</div><div class="foot">Avoidable FX cost (~${inrL(D.meta.historicalAnnual)}/yr) the merchant paid</div></div>
      </div>
      ${(() => { const tr = o.triggers || []; const m = tr.filter((t) => t.measured); const g = m.reduce((s, t) => s + t.gain, 0); return `<div class="card pad mt kpi"><div class="lab">Rate rules · target-rate & opportunity conversions vs their original schedule</div><div class="val num ${g < 0 ? "warn" : "ok"}">${tr.length ? (g >= 0 ? "+" : "") + inrL(g) : "-"}</div><div class="foot">${tr.length ? `${tr.length} tranche(s) converted early · ${m.length} measured once the original date passed. Can be negative - tracked to tune alert thresholds, never claimed as prediction.` : "No rate-triggered conversions yet"}</div></div>`; })()}
      <div class="grid g4 mt">
        <div class="card pad kpi"><div class="lab">Recommendations shown</div><div class="val">${o.shown}</div><div class="foot">${o.ignored} not acted on</div></div>
        <div class="card pad kpi"><div class="lab">Approved without edit</div><div class="val">${pct(o.approved, acted)}</div><div class="foot">${o.approved} approved · ${o.edited} edited · ${o.skipped} skipped</div></div>
        <div class="card pad kpi"><div class="lab">Decisions by channel</div><div class="val">${o.channels.mobile} / ${o.channels.dashboard}</div><div class="foot">Mobile (WhatsApp → app) / dashboard</div></div>
        <div class="card pad kpi"><div class="lab">Questions answered</div><div class="val">${o.answered}</div><div class="foot">Low-confidence items resolved by asking</div></div>
